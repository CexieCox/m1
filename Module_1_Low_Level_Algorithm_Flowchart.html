<line x1="60" y1="325" x2="60" y2="375" stroke="#1E293B" stroke-width="3" />
<text x="68" y="337" font-size="10.5" font-weight="700" fill="#0F172A">DETERMINISTIC LOCATOR CONTRACT</text>
<text x="68" y="351" font-size="9.5" fill="#334155">Strict pruning of symlinks, junctions, reparse points (0x400).</text>
<text x="68" y="365" font-size="9.5" fill="#334155">Physical deduplication via (st_dev, st_ino) keys.</text>
<text x="68" y="379" font-size="9.5" fill="#334155">SHA256 resolution: filename pattern -&gt; ijson prefetch.</text>
<line x1="60" y1="555" x2="60" y2="620" stroke="#1E293B" stroke-width="3" />
<text x="68" y="567" font-size="10.5" font-weight="700" fill="#0F172A">THREE-TIER SCREENING MODEL</text>
<text x="68" y="581" font-size="9.5" fill="#334155">Tiers: Candidate -&gt; Observed -&gt; Payload Execution.</text>
<text x="68" y="595" font-size="9.5" fill="#334155">Partitions: same_seed_family, one_seed_missing, diff_review.</text>
<text x="68" y="609" font-size="9.5" fill="#334155">Only seed family members qualify for candidate status.</text>
<line x1="60" y1="800" x2="60" y2="865" stroke="#1E293B" stroke-width="3" />
<text x="68" y="812" font-size="10.5" font-weight="700" fill="#0F172A">BOUNDED RESOURCE STREAMING</text>
<text x="68" y="826" font-size="9.5" fill="#334155">Parse limits: max file bytes, max call bytes, max JSON depth.</text>
<text x="68" y="840" font-size="9.5" fill="#334155">Multi-worker pool with timeout isolation.</text>
<text x="68" y="854" font-size="9.5" fill="#334155">Extract process tree, API calls, dropped files, memory dumps.</text>
<line x1="60" y1="1045" x2="60" y2="1125" stroke="#1E293B" stroke-width="3" />
<text x="68" y="1057" font-size="10.5" font-weight="700" fill="#0F172A">CONSERVATIVE BINDING CONTRACT</text>
<text x="68" y="1071" font-size="9.5" fill="#334155">observed = supported_family(target) AND trustworthy_binding(target-&gt;proc)</text>
<text x="68" y="1085" font-size="9.5" fill="#334155">           AND runtime_execution(proc) AND NOT conflicts.</text>
<text x="68" y="1099" font-size="9.5" fill="#334155">Binding trust: machine (cmdline/hash) + registry rules + review.</text>
<text x="68" y="1113" font-size="9.5" fill="#334155">payload_execution = observed AND child stage execution observed.</text>
<line x1="60" y1="1305" x2="60" y2="1370" stroke="#1E293B" stroke-width="3" />
<text x="68" y="1317" font-size="10.5" font-weight="700" fill="#0F172A">INDEPENDENT AUDIT TRAIL</text>
<text x="68" y="1331" font-size="9.5" fill="#334155">15 independent QC checks (QC-01..QC-15).</text>
<text x="68" y="1345" font-size="9.5" fill="#334155">Atomic SQLite state snapshot.</text>
<text x="68" y="1359" font-size="9.5" fill="#334155">CSV injection protection + UTF-8 BOM encoding.</text>
<line x1="60" y1="1550" x2="60" y2="1600" stroke="#1E293B" stroke-width="3" />
<text x="68" y="1562" font-size="10.5" font-weight="700" fill="#0F172A">DOWNSTREAM DATASET EXPORT</text>
<text x="68" y="1576" font-size="9.5" fill="#334155">Byte-for-byte verified copy of candidate JSON reports.</text>
<text x="68" y="1590" font-size="9.5" fill="#334155">Immutable source run: write to isolated destination directory.</text>
<line x1="540" y1="165" x2="540" y2="250" stroke="#1E293B" stroke-width="3" />
<text x="548" y="177" font-size="10.5" font-weight="700" fill="#0F172A">INPUT ROOTS &amp; GLOB PATTERNS</text>
<text x="548" y="191" font-size="9.5" fill="#334155">Supports multiple roots (WinMET Vols 1-5).</text>
<text x="548" y="205" font-size="9.5" fill="#334155">Translates include/exclude globs to regex.</text>
<text x="548" y="219" font-size="9.5" fill="#334155">Prunes output directories to prevent recursion.</text>
<line x1="540" y1="270" x2="540" y2="355" stroke="#1E293B" stroke-width="3" />
<text x="548" y="282" font-size="10.5" font-weight="700" fill="#0F172A">FILESYSTEM SAFETY GUARDS</text>
<text x="548" y="296" font-size="9.5" fill="#334155">Prunes symlinks, junctions, reparse points (0x400).</text>
<text x="548" y="310" font-size="9.5" fill="#334155">Guards against circular traversal &amp; lock hanging.</text>
<text x="548" y="324" font-size="9.5" fill="#334155">Validates regular files via stat.S_ISREG.</text>
<line x1="540" y1="375" x2="540" y2="460" stroke="#1E293B" stroke-width="3" />
<text x="548" y="387" font-size="10.5" font-weight="700" fill="#0F172A">PHYSICAL DEDUPLICATION</text>
<text x="548" y="401" font-size="9.5" fill="#334155">Maps (st_dev, st_ino) -&gt; primary DiscoveredFile.</text>
<text x="548" y="415" font-size="9.5" fill="#334155">Duplicate physical files -&gt; secondary locators.</text>
<text x="548" y="429" font-size="9.5" fill="#334155">source_id = sha256(root_id + &#x27;\0&#x27; + relpath).</text>
<line x1="540" y1="480" x2="540" y2="565" stroke="#1E293B" stroke-width="3" />
<text x="548" y="492" font-size="10.5" font-weight="700" fill="#0F172A">IDENTITY PREFETCH STREAMING</text>
<text x="548" y="506" font-size="9.5" fill="#334155">If mode requires target sha256 (auto/report),</text>
<text x="548" y="520" font-size="9.5" fill="#334155">stream-parse target.file.sha256 via ijson.</text>
<text x="548" y="534" font-size="9.5" fill="#334155">Bounded by max_file_bytes; avoids full DOM RAM.</text>
<line x1="540" y1="1005" x2="540" y2="1090" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1017" font-size="10.5" font-weight="700" fill="#0F172A">SEED TAXONOMY CONTRACT</text>
<text x="548" y="1031" font-size="9.5" fill="#334155">Explicit seed family list: smokeloader, guloader, sload,...</text>
<text x="548" y="1045" font-size="9.5" fill="#334155">Normalizes aliases to canonical identifiers.</text>
<text x="548" y="1059" font-size="9.5" fill="#334155">Casefold canonical resolution contract.</text>
<line x1="540" y1="1110" x2="540" y2="1195" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1122" font-size="10.5" font-weight="700" fill="#0F172A">TRIPLE LABEL RECONCILIATION</text>
<text x="548" y="1136" font-size="9.5" fill="#334155">AVClass + CAPE Detections + Consensus mapping.</text>
<text x="548" y="1150" font-size="9.5" fill="#334155">Per-kind state: present | absent | missing | conflict.</text>
<text x="548" y="1164" font-size="9.5" fill="#334155">Pair state: same_canonical | one_present | diff | unresolved.</text>
<line x1="540" y1="1215" x2="540" y2="1300" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1227" font-size="10.5" font-weight="700" fill="#0F172A">THREE-TIER PARTITIONING</text>
<text x="548" y="1241" font-size="9.5" fill="#334155">Partition 1: same_seed_family (high confidence agreement).</text>
<text x="548" y="1255" font-size="9.5" fill="#334155">Partition 2: one_seed_other_missing (unilateral signal).</text>
<text x="548" y="1269" font-size="9.5" fill="#334155">Partition 3: different_nonmissing_labels_review (conflict).</text>
<line x1="540" y1="1320" x2="540" y2="1405" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1332" font-size="10.5" font-weight="700" fill="#0F172A">CANDIDATE ADMISSION PREDICATE</text>
<text x="548" y="1346" font-size="9.5" fill="#334155">is_candidate = True iff label in seed taxonomy families</text>
<text x="548" y="1360" font-size="9.5" fill="#334155">or consensus indicates loader candidate.</text>
<text x="548" y="1374" font-size="9.5" fill="#334155">Non-loaders categorized as not_candidate.</text>
<line x1="540" y1="1845" x2="540" y2="1930" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1857" font-size="10.5" font-weight="700" fill="#0F172A">SELECTIVE CANDIDATE SCOPE</text>
<text x="548" y="1871" font-size="9.5" fill="#334155">Default analysis scope: candidates only.</text>
<text x="548" y="1885" font-size="9.5" fill="#334155">Optional scope: all (full corpus audit).</text>
<text x="548" y="1899" font-size="9.5" fill="#334155">Avoids parsing gigabytes of irrelevant traces.</text>
<line x1="540" y1="1950" x2="540" y2="2035" stroke="#1E293B" stroke-width="3" />
<text x="548" y="1962" font-size="10.5" font-weight="700" fill="#0F172A">BOUNDED STREAMING (ijson)</text>
<text x="548" y="1976" font-size="9.5" fill="#334155">Direct streaming over CAPE JSON tokens.</text>
<text x="548" y="1990" font-size="9.5" fill="#334155">Never loads full JSON tree into RAM.</text>
<text x="548" y="2004" font-size="9.5" fill="#334155">max_json_depth guard prevents deep stack overflows.</text>
<line x1="540" y1="2055" x2="540" y2="2140" stroke="#1E293B" stroke-width="3" />
<text x="548" y="2067" font-size="10.5" font-weight="700" fill="#0F172A">MULTI-WORKER TIMEOUT GUARDS</text>
<text x="548" y="2081" font-size="9.5" fill="#334155">ParseScheduler spawns isolated worker pool.</text>
<text x="548" y="2095" font-size="9.5" fill="#334155">Enforces max_file_bytes (200MB) &amp; timeout_seconds.</text>
<text x="548" y="2109" font-size="9.5" fill="#334155">Worker kills hanging JSON parser gracefully.</text>
<line x1="540" y1="2160" x2="540" y2="2245" stroke="#1E293B" stroke-width="3" />
<text x="548" y="2172" font-size="10.5" font-weight="700" fill="#0F172A">EVIDENCE ABSTRACTION CONTRACT</text>
<text x="548" y="2186" font-size="9.5" fill="#334155">Process tree: PID, PPID, cmdline, call_count.</text>
<text x="548" y="2200" font-size="9.5" fill="#334155">API events: process_create, remote_thread, alloc.</text>
<text x="548" y="2214" font-size="9.5" fill="#334155">Synthesizes Fact records with deterministic evidence_id.</text>
<line x1="540" y1="2705" x2="540" y2="2790" stroke="#1E293B" stroke-width="3" />
<text x="548" y="2717" font-size="10.5" font-weight="700" fill="#0F172A">CONSERVATIVE-V1 PREDICATE</text>
<text x="548" y="2731" font-size="9.5" fill="#334155">observed = supported_family(target)</text>
<text x="548" y="2745" font-size="9.5" fill="#334155">           AND trustworthy_binding(target-&gt;process)</text>
<text x="548" y="2759" font-size="9.5" fill="#334155">           AND runtime_execution(process)</text>
<text x="548" y="2773" font-size="9.5" fill="#334155">           AND NOT invalidating_conflicts.</text>
<line x1="540" y1="2810" x2="540" y2="2895" stroke="#1E293B" stroke-width="3" />
<text x="548" y="2822" font-size="10.5" font-weight="700" fill="#0F172A">BINDING TRUST HIERARCHY</text>
<text x="548" y="2836" font-size="9.5" fill="#334155">Machine bindings: cmdline hash, injection target.</text>
<text x="548" y="2850" font-size="9.5" fill="#334155">Registry rules: curated technical patterns.</text>
<text x="548" y="2864" font-size="9.5" fill="#334155">Human audit: verified analysts&#x27; reviews.</text>
<text x="548" y="2878" font-size="9.5" fill="#334155">Unbound execution -&gt; stays false; flagged review.</text>
<line x1="540" y1="2915" x2="540" y2="3000" stroke="#1E293B" stroke-width="3" />
<text x="548" y="2927" font-size="10.5" font-weight="700" fill="#0F172A">RUNTIME EXECUTION PROOF</text>
<text x="548" y="2941" font-size="9.5" fill="#334155">Target process must have call_count &gt; 0.</text>
<text x="548" y="2955" font-size="9.5" fill="#334155">Verified via successful process_create or</text>
<text x="548" y="2969" font-size="9.5" fill="#334155">remote_thread targeting candidate process PID.</text>
<text x="548" y="2983" font-size="9.5" fill="#334155">No execution call -&gt; not evaluated.</text>
<line x1="540" y1="3020" x2="540" y2="3105" stroke="#1E293B" stroke-width="3" />
<text x="548" y="3032" font-size="10.5" font-weight="700" fill="#0F172A">PAYLOAD EXECUTION TIER</text>
<text x="548" y="3046" font-size="9.5" fill="#334155">payload_execution = observed</text>
<text x="548" y="3060" font-size="9.5" fill="#334155">AND secondary execution of non-target payload</text>
<text x="548" y="3074" font-size="9.5" fill="#334155">(dropped exe, procdump, hollowed child process).</text>
<text x="548" y="3088" font-size="9.5" fill="#334155">Distinguishes initial loader from actual payload.</text>
<line x1="540" y1="3125" x2="540" y2="3210" stroke="#1E293B" stroke-width="3" />
<text x="548" y="3137" font-size="10.5" font-weight="700" fill="#0F172A">SECURE MANIFEST GENERATION</text>
<text x="548" y="3151" font-size="9.5" fill="#334155">UTF-8 BOM encoding for Excel compatibility.</text>
<text x="548" y="3165" font-size="9.5" fill="#334155">Sanitizes leading formula chars (=, +, -, @).</text>
<text x="548" y="3179" font-size="9.5" fill="#334155">Streams all_reports.jsonl with full decision trace.</text>
<line x1="540" y1="3605" x2="540" y2="3690" stroke="#1E293B" stroke-width="3" />
<text x="548" y="3617" font-size="10.5" font-weight="700" fill="#0F172A">ISOLATED CHECK EXECUTION</text>
<text x="548" y="3631" font-size="9.5" fill="#334155">Each check runs in isolated try-except block.</text>
<text x="548" y="3645" font-size="9.5" fill="#334155">Check exception -&gt; recorded as &#x27;error&#x27; not abort.</text>
<text x="548" y="3659" font-size="9.5" fill="#334155">Ensures full QA audit visibility even on broken runs.</text>
<line x1="540" y1="3710" x2="540" y2="3815" stroke="#1E293B" stroke-width="3" />
<text x="548" y="3722" font-size="10.5" font-weight="700" fill="#0F172A">15 QUALITY CONTROL CHECKS</text>
<text x="548" y="3736" font-size="9.5" fill="#334155">QC-01..03: Config, taxonomy, label fingerprints.</text>
<text x="548" y="3750" font-size="9.5" fill="#334155">QC-04..06: Source ID uniqueness, derivation, 1:1 map.</text>
<text x="548" y="3764" font-size="9.5" fill="#334155">QC-07..08: Evidence checksums &amp; non-empty schema.</text>
<text x="548" y="3778" font-size="9.5" fill="#334155">QC-09..11: Decision coverage, CSV BOM, row parity.</text>
<text x="548" y="3792" font-size="9.5" fill="#334155">QC-12..13: Hierarchy (observed &lt;= cand &lt;= all) &amp; unres.</text>
<text x="548" y="3806" font-size="9.5" fill="#334155">QC-14..15: Run markers &amp; State/Logs audit trail.</text>
<line x1="540" y1="3835" x2="540" y2="3920" stroke="#1E293B" stroke-width="3" />
<text x="548" y="3847" font-size="10.5" font-weight="700" fill="#0F172A">ATOMIC OUTCOME CONTRACT</text>
<text x="548" y="3861" font-size="9.5" fill="#334155">Overall status is &#x27;pass&#x27; iff 0 failures.</text>
<text x="548" y="3875" font-size="9.5" fill="#334155">Emits qa/qa_report.json with full check details.</text>
<text x="548" y="3889" font-size="9.5" fill="#334155">Writes .loaderfilter-output.json completion marker.</text>
<line x1="540" y1="4445" x2="540" y2="4530" stroke="#1E293B" stroke-width="3" />
<text x="548" y="4457" font-size="10.5" font-weight="700" fill="#0F172A">IMMUTABLE SOURCE RUN</text>
<text x="548" y="4471" font-size="9.5" fill="#334155">Exports NEVER modify the source run directory.</text>
<text x="548" y="4485" font-size="9.5" fill="#334155">All output written to a fresh destination layout.</text>

<text x="548" y="4562" font-size="10.5" font-weight="700" fill="#0F172A">BYTE-FOR-BYTE COPY &amp; VERIFY</text>

<text x="548" y="4590" font-size="9.5" fill="#334155">Calculates SHA-256 of copied bytes.</text>
<text x="548" y="4604" font-size="9.5" fill="#334155">Verifies matches recorded manifest SHA-256.</text>
<text x="548" y="4618" font-size="9.5" fill="#334155">Atomically renames to final destination path.</text>

<text x="548" y="4709" font-size="9.5" fill="#334155">Optional --group-by-year partition.</text>
